<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="hust-fx.js"></script>
    <title>Hüst Tênis - Configurações</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"></noscript>
    <link rel="icon" href="HUst%20Logo.jpg" type="image/jpeg">
    <style>
        .ajustes-container { max-width: 800px; margin: 50px auto; padding: 40px; background: #080808; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .ajustes-container h1 { text-align: center; text-transform: uppercase; font-size: 28px; margin-bottom: 40px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        .config-section { margin-bottom: 30px; }
        .config-section h3 { font-size: 16px; color: #ff3333; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .opcoes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .btn-opcao { background: #151515; color: #fff; border: 1px solid #333; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.3s; text-align: center; }
        .btn-opcao:hover { border-color: #ff3333; background: rgba(255, 51, 51, 0.1); }
        .btn-opcao.ativo { background: #ff3333; color: #fff; border-color: #ff3333; }
        .btn-reset { width: 100%; background: transparent; color: #888; border: 1px solid #444; padding: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; border-radius: 8px; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .btn-reset:hover { color: #fff; border-color: #fff; }
    </style>
</head>
<body>

<header>
<div class="navbar">
    <!-- LOGO E BOTÃO DE PERFIL -->
    <div style="display: flex; align-items: center; gap: 20px;">
        <div class="logo">
            <img src="./img/logoHustverme.png" alt="Logo Hust">
        </div>
        <button id="btn-perfil" class="nav-profile-btn" onclick="abrirPerfil()">
            <img id="img-perfil-nav" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="nav-profile-img" alt="Perfil" loading="lazy" decoding="async">
            <span id="txt-perfil-nav" style="font-size: 14px; font-weight: bold;">Convidado</span>
        </button>
    </div>

    <div style="position: relative; display: flex; align-items: center; justify-content: flex-end; flex: 1;">
        <button class="nav-scroll-btn nav-btn-left" onclick="rolarNav(-150)">❮</button>
        <nav id="menuNav">
            <a href="carrinho.html">🛒 <span id="contador">0</span></a>
            <a href="index.html">INICIO</a>
            <a href="catalogo.html">CATALOGO</a>
            <a href="novidades.html">NOVIDADES</a>
            <a href="Joganoestilo.html">SE JOGA NO ESTILO</a>
            <a href="Equipe.html">EQUIPE</a>
            <a href="ajustes.html" class="nav-gear-btn" title="Ajustes" aria-label="Ajustes">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </a>
        </nav>
        <button class="nav-scroll-btn nav-btn-right" onclick="rolarNav(150)">❯</button>
    </div>
</div>
</header>

<main>
    <div class="ajustes-container">
        <h1>Preferências de Acessibilidade</h1>
        <div class="config-section">
            <h3>Contraste</h3>
            <div class="opcoes-grid">
                <button class="btn-opcao" id="btn-contraste-normal" onclick="setContraste('normal')">Normal</button>
                <button class="btn-opcao" id="btn-contraste-alto" onclick="setContraste('alto-contraste')">Alto Contraste</button>
                <button class="btn-opcao" id="btn-contraste-cinza" onclick="setContraste('escala-cinza')">Escala de Cinza</button>
            </div>
        </div>
        <div class="config-section">
            <h3>Tamanho da Fonte</h3>
            <div class="opcoes-grid">
                <button class="btn-opcao" id="btn-fonte-normal" onclick="setFonte('normal')">Padrão</button>
                <button class="btn-opcao" id="btn-fonte-grande" onclick="setFonte('fonte-grande')">Grande</button>
                <button class="btn-opcao" id="btn-fonte-gigante" onclick="setFonte('fonte-gigante')">Gigante</button>
            </div>
        </div>
        <div class="config-section">
            <h3>Modo Leitura (Dislexia)</h3>
            <div class="opcoes-grid">
                <button class="btn-opcao" id="btn-dislexia-off" onclick="setDislexia(false)">Desativado</button>
                <button class="btn-opcao" id="btn-dislexia-on" onclick="setDislexia(true)">Ativado (Fonte Arial)</button>
            </div>
        </div>
        <button class="btn-reset" onclick="resetarConfiguracoes()">Restaurar Padrões Originais</button>
    </div>
</main>

<footer style="background-color: #050505; border-top: 1px solid #1a1a1a; padding: 40px 20px; text-align: center; color: #777; font-size: 0.9rem;">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; align-items: center;">
        <img src="./img/logoHustverme.png" alt="Hust Logo" style="width: 80px; opacity: 0.8;" loading="lazy" decoding="async">
        <p>© 2026 HÜST. Todos os direitos reservados.</p>
        <div style="display: flex; gap: 20px; align-items: center;">
            <a href="https://instagram.com/hust.company" target="_blank" style="color: #fff; display: inline-flex;" aria-label="Instagram">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
            </a>
            <a href="#" style="color: #fff; display: inline-flex;" aria-label="WhatsApp">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
            </a>
            <a href="#" style="color: #fff; display: inline-flex;" aria-label="TikTok">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"></path>
                </svg>
            </a>
        </div>
    </div>
</footer>

<!-- MODAL DE PERFIL -->
<div id="modalPerfil" class="modal-perfil">
    <div class="perfil-card">
        <span class="perfil-fechar" onclick="fecharPerfil()">&times;</span>
        <div class="perfil-foto-container">
            <img id="img-perfil-modal" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Foto do Perfil" loading="lazy" decoding="async">
            <button class="btn-editar-foto" onclick="mudarFotoPerfil()"><i class="fas fa-camera"></i></button>
        </div>
        <div class="perfil-info">
            <h3 id="nome-perfil-modal">Nome</h3>
            <p id="email-perfil-modal">email@exemplo.com</p>
            <p id="estilo-perfil-modal">Estilo: -</p>
        </div>
        <button class="btn-sair-conta" onclick="sairDaConta()">Sair da Conta</button>
    </div>
</div>

<script>
// SISTEMA DE PERFIL
function verificarPerfil() {
    const usuario = JSON.parse(localStorage.getItem('hust_user'));
    const btnTexto = document.getElementById('txt-perfil-nav');
    const imgNav = document.getElementById('img-perfil-nav');
    const imgModal = document.getElementById('img-perfil-modal');

    if (usuario) {
        btnTexto.innerText = usuario.nome.split(' ')[0];
        if (usuario.foto) { imgNav.src = usuario.foto; imgModal.src = usuario.foto; }
    } else {
        btnTexto.innerText = "Convidado";
        imgNav.src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
    }
}
function abrirPerfil() {
    const usuario = JSON.parse(localStorage.getItem('hust_user'));
    if (!usuario) {
        if (confirm("Você ainda não tem uma conta. Deseja criar uma agora?")) window.location.href = "Cadastro.html";
    } else {
        document.getElementById('nome-perfil-modal').innerText = usuario.nome;
        document.getElementById('email-perfil-modal').innerText = usuario.email;
        document.getElementById('estilo-perfil-modal').innerText = (usuario.estilo ? "Estilo Preferido: " + usuario.estilo : "Membro HÜST");
        document.getElementById('modalPerfil').style.display = "flex";
    }
}
function fecharPerfil() { document.getElementById('modalPerfil').style.display = "none"; }
function mudarFotoPerfil() {
    const novaFoto = prompt("Cole aqui o link (URL) da sua nova foto de perfil:");
    if (novaFoto) {
        const usuario = JSON.parse(localStorage.getItem('hust_user'));
        usuario.foto = novaFoto;
        localStorage.setItem('hust_user', JSON.stringify(usuario));
        verificarPerfil();
        alert("Foto atualizada com sucesso!");
    }
}
function sairDaConta() {
    if(confirm("Tem certeza que deseja sair?")) {
        localStorage.removeItem('hust_user');
        fecharPerfil();
        verificarPerfil();
    }
}

function rolarNav(valor) {
    const nav = document.getElementById('menuNav');
    if(nav) nav.scrollBy({ left: valor, behavior: 'smooth' });
}

function setContraste(modo) {
    localStorage.setItem('hust_contraste', modo);
    document.body.classList.remove('alto-contraste', 'escala-cinza');
    if (modo !== 'normal') document.body.classList.add(modo);
    atualizarBotoesAtivos();
}

function setFonte(tamanho) {
    localStorage.setItem('hust_fonte', tamanho);
    document.body.classList.remove('fonte-grande', 'fonte-gigante');
    if (tamanho !== 'normal') document.body.classList.add(tamanho);
    atualizarBotoesAtivos();
}

function setDislexia(estado) {
    localStorage.setItem('hust_dislexia', estado);
    if (estado) { document.body.classList.add('fonte-legivel'); } else { document.body.classList.remove('fonte-legivel'); }
    atualizarBotoesAtivos();
}

function resetarConfiguracoes() {
    localStorage.removeItem('hust_contraste');
    localStorage.removeItem('hust_fonte');
    localStorage.removeItem('hust_dislexia');
    document.body.classList.remove('alto-contraste', 'escala-cinza', 'fonte-grande', 'fonte-gigante', 'fonte-legivel');
    atualizarBotoesAtivos();
}

function atualizarBotoesAtivos() {
    document.querySelectorAll('.btn-opcao').forEach(btn => btn.classList.remove('ativo'));
    let contraste = localStorage.getItem('hust_contraste') || 'normal';
    if(contraste === 'normal') document.getElementById('btn-contraste-normal').classList.add('ativo');
    else if(contraste === 'alto-contraste') document.getElementById('btn-contraste-alto').classList.add('ativo');
    else if(contraste === 'escala-cinza') document.getElementById('btn-contraste-cinza').classList.add('ativo');

    let fonte = localStorage.getItem('hust_fonte') || 'normal';
    if(fonte === 'normal') document.getElementById('btn-fonte-normal').classList.add('ativo');
    else if(fonte === 'fonte-grande') document.getElementById('btn-fonte-grande').classList.add('ativo');
    else if(fonte === 'fonte-gigante') document.getElementById('btn-fonte-gigante').classList.add('ativo');

    let dislexia = localStorage.getItem('hust_dislexia') === 'true';
    if(dislexia) document.getElementById('btn-dislexia-on').classList.add('ativo');
    else document.getElementById('btn-dislexia-off').classList.add('ativo');
}

document.addEventListener("DOMContentLoaded", () => {
    verificarPerfil();
    let carrinho = JSON.parse(localStorage.getItem('hust_carrinho')) || [];
    const contador = document.getElementById('contador');
    if (contador) contador.innerText = carrinho.length;

    let contraste = localStorage.getItem('hust_contraste');
    let tamanhoFonte = localStorage.getItem('hust_fonte');
    let dislexia = localStorage.getItem('hust_dislexia') === 'true';

    if (contraste && contraste !== 'normal') document.body.classList.add(contraste);
    if (tamanhoFonte && tamanhoFonte !== 'normal') document.body.classList.add(tamanhoFonte);
    if (dislexia) document.body.classList.add('fonte-legivel');

    atualizarBotoesAtivos();
});
</script>
<script src="hust-sync.js"></script>
</body>
</html>
