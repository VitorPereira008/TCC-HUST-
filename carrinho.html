    <style>
        .btn-galeria-perfil { width: 100%; margin-top: 14px; padding: 12px; background: #ff3333; border: none; border-radius: 10px; color: #ffffff; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.25s ease; }
        .btn-galeria-perfil:hover { background: #cc0000; transform: translateY(-1px); }
        .carrinho-container { max-width: 1200px; margin: 50px auto; padding: 0 20px; display: flex; gap: 40px; min-height: 50vh; }
        .lista-carrinho { flex: 2; background: #080808; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 30px; }
        .carrinho-item { display: flex; align-items: center; gap: 20px; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); position: relative; }
        .carrinho-item:last-child { border-bottom: none; }
        .carrinho-item img { width: 100px; height: 100px; object-fit: contain; background: #111; border-radius: 8px; padding: 10px; }
        .item-info { flex: 1; }
        .item-info h3 { font-size: 16px; margin-bottom: 5px; text-transform: uppercase; }
        .item-info .preco { color: #00ff66; font-weight: bold; font-size: 18px; }
        .remover-item { background: transparent; color: #ff3333; border: none; font-size: 20px; cursor: pointer; transition: 0.3s; }
        .remover-item:hover { color: #ff0000; transform: scale(1.1); }
        .resumo-carrinho { flex: 1; background: #080808; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 30px; height: fit-content; position: sticky; top: 100px; }
        .resumo-carrinho h2 { font-size: 20px; text-transform: uppercase; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .cupom-container { margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        .cupom-input-group { display: flex; gap: 10px; margin-top: 10px; }
        .cupom-input-group input { flex: 1; padding: 12px; background: #111; border: 1px solid #333; color: white; border-radius: 6px; text-transform: uppercase; }
        .cupom-input-group button { padding: 10px 20px; background: #333; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .cupom-input-group button:hover { background: #ff3333; }
        .linha-resumo { display: flex; justify-content: space-between; margin-bottom: 15px; color: #ccc; font-size: 14px; }
        .linha-desconto { color: #00ff66; display: none; }
        .total-resumo { display: flex; justify-content: space-between; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 22px; font-weight: 800; color: #fff; }
        .btn-finalizar { width: 100%; background: #ff3333; color: white; border: none; padding: 15px; font-size: 16px; font-weight: 800; text-transform: uppercase; border-radius: 8px; margin-top: 25px; cursor: pointer; transition: background 0.3s; }
        .btn-finalizar:hover { background: #e02828; }
        .btn-finalizar:disabled { background: #555; cursor: not-allowed; }
        .carrinho-vazio { text-align: center; padding: 40px; color: #888; }
        @media (max-width: 768px) { .carrinho-container { flex-direction: column; } .carrinho-item { flex-direction: column; text-align: center; } .remover-item { position: absolute; top: 10px; right: 10px; } }
    </style>
</head>

<!-- MODAL DE PERFIL COM GALERIA MOBILE/DESKTOP -->
<div id="modalPerfil" class="modal-perfil">
    <div class="perfil-card">
        <span class="perfil-fechar" onclick="fecharPerfil()">&times;</span>
        <div class="perfil-foto-container">
            <img id="img-perfil-modal" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Foto do Perfil" loading="lazy" decoding="async">
            <button type="button" class="btn-editar-foto" onclick="abrirGaleriaFoto()" title="Escolher foto da galeria"><i class="fas fa-camera"></i></button>
        </div>

        <input type="file" id="input-foto-galeria" accept="image/*" style="display: none;" onchange="processarFotoGaleria(event)">

        <div class="perfil-info">
            <h3 id="nome-perfil-modal">Nome</h3>
            <p id="email-perfil-modal">email@exemplo.com</p>
            <p id="estilo-perfil-modal">Estilo: -</p>
        </div>

        <button type="button" class="btn-galeria-perfil" onclick="abrirGaleriaFoto()">
            <i class="fas fa-images"></i> Escolher Foto da Galeria
        </button>

        <button type="button" class="btn-link-url-admin" onclick="mudarFotoPorUrl()">
            <i class="fas fa-link"></i> Ou colar link (URL) da internet
        </button>

        <button type="button" class="btn-sair-conta" onclick="sairDaConta()">Sair da Conta</button>
    </div>
</div>

<script>
// SISTEMA DE PERFIL + GALERIA DE FOTOS MOBILE/DESKTOP
function abrirGaleriaFoto() {
    const input = document.getElementById('input-foto-galeria');
    if (input) {
        input.value = "";
        input.click();
    }
}

function atualizarFotoNoBanco(usuario, fotoFinal) {
    usuario.foto = fotoFinal;
    localStorage.setItem('hust_user', JSON.stringify(usuario));

    try {
        let dbUsuarios = JSON.parse(localStorage.getItem('hust_usuarios_db')) || [];
        const idx = dbUsuarios.findIndex(u => (u.email || '').toLowerCase() === (usuario.email || '').toLowerCase());
        if (idx !== -1) {
            dbUsuarios[idx].foto = fotoFinal;
            localStorage.setItem('hust_usuarios_db', JSON.stringify(dbUsuarios));
        }
    } catch (e) {}

    verificarPerfil();
}

function processarFotoGaleria(event) {
    const arquivo = event.target.files[0];
    if (!arquivo) return;

    if (!arquivo.type.startsWith('image/')) {
        alert("Por favor, selecione uma imagem válida da sua galeria.");
        return;
    }

    const usuario = JSON.parse(localStorage.getItem('hust_user'));
    if (!usuario) return;

    const leitor = new FileReader();
    leitor.onload = function (e) {
        const imgTemp = new Image();
        imgTemp.onload = function () {
            const canvas = document.createElement('canvas');
            const tamanhoMax = 300;
            let largura = imgTemp.width;
            let altura = imgTemp.height;

            if (largura > altura) {
                if (largura > tamanhoMax) {
                    altura = Math.round((altura * tamanhoMax) / largura);
                    largura = tamanhoMax;
                }
            } else {
                if (altura > tamanhoMax) {
                    largura = Math.round((largura * tamanhoMax) / altura);
                    altura = tamanhoMax;
                }
            }

            canvas.width = largura;
            canvas.height = altura;
            canvas.getContext('2d').drawImage(imgTemp, 0, 0, largura, altura);
            const fotoBase64 = canvas.toDataURL('image/jpeg', 0.82);

            try {
                atualizarFotoNoBanco(usuario, fotoBase64);
                alert("Foto da galeria atualizada com sucesso!");
            } catch (erro) {
                alert("A imagem ficou muito pesada. Tente escolher outra foto.");
            }
        };
        imgTemp.src = e.target.result;
    };
    leitor.readAsDataURL(arquivo);
}

function mudarFotoPorUrl() {
    const usuario = JSON.parse(localStorage.getItem('hust_user'));
    if (!usuario) return;
    const novaFoto = prompt("Cole aqui o link (URL) da sua nova foto de perfil:");
    if (novaFoto && novaFoto.trim() !== "") {
        atualizarFotoNoBanco(usuario, novaFoto.trim());
        alert("Foto atualizada com sucesso!");
    }
}

function verificarPerfil() {
    const usuario = JSON.parse(localStorage.getItem('hust_user'));
    const btnTexto = document.getElementById('txt-perfil-nav');
    const imgNav = document.getElementById('img-perfil-nav');
    const imgModal = document.getElementById('img-perfil-modal');

    if (usuario) {
        btnTexto.innerText = usuario.nome.split(' ')[0];
        if (usuario.foto) { imgNav.src = usuario.foto; imgModal.src = usuario.foto; }
    } else {
        btnTexto.innerText = "Convidado";
        imgNav.src = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
    }
}
function abrirPerfil() {
    const usuario = JSON.parse(localStorage.getItem('hust_user'));
    if (!usuario) {
        if (confirm("Você ainda não tem uma conta. Deseja criar uma agora?")) window.location.href = "Cadastro.html";
    } else {
        document.getElementById('nome-perfil-modal').innerText = usuario.nome;
        document.getElementById('email-perfil-modal').innerText = usuario.email;
        document.getElementById('estilo-perfil-modal').innerText = (usuario.estilo ? "Estilo Preferido: " + usuario.estilo : "Membro HÜST");
        document.getElementById('modalPerfil').style.display = "flex";
    }
}
function fecharPerfil() { document.getElementById('modalPerfil').style.display = "none"; }
function mudarFotoPerfil() { abrirGaleriaFoto(); }
function sairDaConta() {
    if(confirm("Tem certeza que deseja sair?")) {
        localStorage.removeItem('hust_user');
        fecharPerfil();
        verificarPerfil();
    }
}

window.addEventListener('click', (event) => {
    const modalPerf = document.getElementById('modalPerfil');
    if (event.target === modalPerf) fecharPerfil();
});

function rolarNav(valor) {
    const nav = document.getElementById('menuNav');
    if(nav) nav.scrollBy({ left: valor, behavior: 'smooth' });
}

let valorSubtotal = 0;
let porcentagemDesconto = 0;

function carregarCarrinho() {
    const carrinho = JSON.parse(localStorage.getItem('hust_carrinho')) || [];
    const container = document.getElementById('lista-carrinho-container');
    const contador = document.getElementById('contador');
    const btnFinalizar = document.getElementById('btn-finalizar');
    
    if(contador) contador.innerText = carrinho.length;

    if (carrinho.length === 0) {
        container.innerHTML = '<div class="carrinho-vazio"><h2>Seu carrinho está vazio.</h2><p>Vá até o catálogo e escolha seus produtos.</p></div>';
        document.getElementById('subtotal').innerText = 'R$ 0,00';
        document.getElementById('total-pedido').innerText = 'R$ 0,00';
        btnFinalizar.disabled = true;
        return;
    }

    btnFinalizar.disabled = false;
    let html = '';
    valorSubtotal = 0;

    carrinho.forEach((item, index) => {
        let precoFormatado = item.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        valorSubtotal += item.preco;

        html += `
            <div class="carrinho-item">
                <img src="${item.imagem}" alt="Produto" loading="lazy" decoding="async">
                <div class="item-info">
                    <h3>${item.nome}</h3>
                    <p class="preco">${precoFormatado}</p>
                </div>
                <button class="remover-item" onclick="removerItem(${index})" title="Remover"><i class="fas fa-trash"></i></button>
            </div>
        `;
    });

    container.innerHTML = html;
    atualizarTotais();
}

function removerItem(index) {
    let carrinho = JSON.parse(localStorage.getItem('hust_carrinho')) || [];
    carrinho.splice(index, 1);
    localStorage.setItem('hust_carrinho', JSON.stringify(carrinho));
    carregarCarrinho();
}

function aplicarCupom() {
    const cupom = document.getElementById('input-cupom').value.toUpperCase().trim();
    const msg = document.getElementById('msg-cupom');
    const linhaDesconto = document.getElementById('linha-desconto');

    if (cupom === 'HUST10') {
        porcentagemDesconto = 0.10;
        msg.innerText = "Cupom HUST10 aplicado! (10% de desconto)";
        msg.style.color = "#00ff66";
        msg.style.display = "block";
        linhaDesconto.style.display = "flex";
    } else if (cupom === 'TCC20') {
        porcentagemDesconto = 0.20;
        msg.innerText = "Cupom TCC20 aplicado! (20% de desconto)";
        msg.style.color = "#00ff66";
        msg.style.display = "block";
        linhaDesconto.style.display = "flex";
    } else {
        porcentagemDesconto = 0;
        msg.innerText = "Cupom inválido ou expirado.";
        msg.style.color = "#ff3333";
        msg.style.display = "block";
        linhaDesconto.style.display = "none";
    }
    atualizarTotais();
}

function atualizarTotais() {
    let valorDesconto = valorSubtotal * porcentagemDesconto;
    let totalFinal = valorSubtotal - valorDesconto;
    document.getElementById('subtotal').innerText = valorSubtotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    document.getElementById('valor-desconto').innerText = "- " + valorDesconto.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    document.getElementById('total-pedido').innerText = totalFinal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

let irParaBancoEmAndamento = false;
window.addEventListener('pageshow', () => { irParaBancoEmAndamento = false; });

function irParaBanco() {
    if (irParaBancoEmAndamento) return;
    let carrinho = JSON.parse(localStorage.getItem('hust_carrinho')) || [];
    if(carrinho.length === 0) { alert("Seu carrinho está vazio."); return; }

    let valorDesconto = valorSubtotal * porcentagemDesconto;
    let totalFinal = valorSubtotal - valorDesconto;

    const cobranca = { valor: totalFinal, loja: 'HÜST TÊNIS', descricao: `Compra de ${carrinho.length} tênis/produtos na loja.` };
    localStorage.setItem('novatrust_cobranca', JSON.stringify(cobranca));
    irParaBancoEmAndamento = true;

    const usuario = JSON.parse(localStorage.getItem('hust_user'));
    const nome = usuario && usuario.nome ? usuario.nome.split(' ')[0] : 'cliente';
    const candidatos = ['banco.html', 'bancoTCC.html', 'bancoTCC.html.html', 'bancoTCC_html.html'];
    let destino = candidatos[0];
    const descobrir = (location.protocol === 'file:') ? Promise.resolve() :
        candidatos.reduce((p, c) => p.then(ok => ok ? ok : fetch(c, { method: 'HEAD' }).then(r => { if (r.ok) { destino = c; return true; } }).catch(() => false)), Promise.resolve(false));

    if (window.HustFX) {
        Promise.all([HustFX.sequencia({ tipo: 'checkout', itens: carrinho.length, total: totalFinal, usuario: nome, manter: true }), descobrir])
            .then(() => { window.location.href = destino; });
    } else {
        descobrir.then(() => { window.location.href = destino; });
    }
}

document.addEventListener("DOMContentLoaded", () => {
    verificarPerfil();
    try {
        let contraste = localStorage.getItem('hust_contraste');
        let tamanhoFonte = localStorage.getItem('hust_fonte');
        let dislexia = localStorage.getItem('hust_dislexia') === 'true';
        if (contraste && contraste !== 'normal') document.body.classList.add(contraste);
        if (tamanhoFonte) document.body.classList.add(tamanhoFonte);
        if (dislexia) document.body.classList.add('fonte-legivel');
    } catch (e) {}
    carregarCarrinho();
});
</script>
